<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoML experiments</title>
  <style>
    body { font: 16px system-ui; max-width: 850px; margin: 40px auto; padding: 0 20px; color: #243044; }
    label { display: block; margin: 14px 0; }
    input, select, button { font: inherit; padding: 6px; }
    fieldset { margin: 20px 0; border: 1px solid #bcc5d0; }
    fieldset label { margin: 8px 0; }
    .form-fields { border: 0; margin: 0; padding: 0; }
    button { background: #224ea2; color: white; border: 0; border-radius: 4px; padding: 10px 20px; }
    button:disabled { opacity: .5; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    #status { white-space: pre-wrap; }
    .history-table { overflow-x: auto; }
    dt { font-weight: 600; margin-top: 10px; }
    dd { margin: 4px 0; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="/static/app.js"></script>
</head>
<body>
  <div id="root">Loading AutoML experiments… Internet access is needed to load React.</div>
  <noscript>Enable JavaScript to use this interface.</noscript>
</body>
</html>
